[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "ibkr-dx"
version = "0.1.0"
description = "Talk directly to IBKR: a client for Interactive Brokers with full TWS API compatibility. No gateway required."
readme = "README.md"
license = { text = "AGPL-3.0-only" }
keywords = ["interactive-brokers", "ibkr", "tws-api", "ibapi", "trading"]
requires-python = ">=3.11"

[project.urls]
Repository = "https://github.com/userFRM/ibkr-dx"

[tool.maturin]
features = ["python", "extension-module"]
python-source = "python"
module-name = "ibkr_dx.ibkr_dx"
