[package]
name = "ibkr-dx"
version = "0.1.0"
edition = "2024"
# The oldest compiler supported, and built on by a job of its own in CI so it
# is checked rather than claimed. The sources use let-chains and fixed-size
# slice chunking, both of which arrived after the edition did.
rust-version = "1.89"
description = "Talk directly to IBKR: an Interactive Brokers client with the TWS API's EClient interface, and no gateway in between."
license = "AGPL-3.0-only"
repository = "https://github.com/userFRM/ibkr-dx"
keywords = ["interactive-brokers", "ibkr", "tws-api", "trading", "market-data"]
categories = ["api-bindings", "finance", "network-programming"]
# Every binary is named below, because the tools under `src/bin` are for
# developing this library rather than for using it, and a caller who installs
# the crate should not be handed 30 of them.
autobins = false
# What a caller installing this crate needs, and nothing else: the library, the
# Python layer the bindings ship with, and what builds them. The developer
# binaries under `src/bin` and the examples are left out, and with their sources
# gone `cargo package` drops their targets from the published manifest.
exclude = [
    ".github/",
    "docs/",
    "examples/",
    "notebooks/",
    "scripts/",
    "src/bin/",
    "tests/",
    "python/ibkr_dx/*.so",
    "rustfmt.toml",
    "uv.lock",
]

[lib]
name = "ibkr_dx"
crate-type = ["lib", "cdylib"]

[features]
default = []
# The measurement and capture tools under `src/bin`. Off by default: they are
# how this library is developed, not how it is used, and most of them read
# credentials.
dev-tools = []
python = ["pyo3"]
# The methods that push state into a client without a venue behind it. Off by
# default, and deliberately: `#[pyo3(...)]` publishes whatever it is put on,
# `#[doc(hidden)]` does not reach the interpreter, and a leading underscore
# hides nothing from `getattr` — so with these compiled in, a wheel hands
# every caller a way to fabricate a connected session, fills and account
# values. The test suites ask for them by name.
test-helpers = []
# Split out so a test binary can link libpython. `extension-module` tells PyO3
# not to link it, which is right for the wheel and wrong for `cargo test`: the
# harness then fails at link time on every Python symbol, and no Rust-side test
# under this feature has ever run (ibkr_dx#381). The wheel build asks for both.
extension-module = ["pyo3/extension-module"]

[[bin]]
name = "bench_decode"
path = "src/bin/bench_decode.rs"
required-features = ["dev-tools"]

[[bin]]
name = "bench_replay"
path = "src/bin/bench_replay.rs"
required-features = ["dev-tools"]

[[bin]]
name = "capture_calendar"
path = "src/bin/capture_calendar.rs"
required-features = ["dev-tools"]

[[bin]]
name = "capture_combo"
path = "src/bin/capture_combo.rs"
required-features = ["dev-tools"]

[[bin]]
name = "capture_line_limit"
path = "src/bin/capture_line_limit.rs"
required-features = ["dev-tools"]

[[bin]]
name = "flatten_paper"
path = "src/bin/flatten_paper.rs"
required-features = ["dev-tools"]

[[bin]]
name = "capture_conformance"
path = "src/bin/capture_conformance.rs"
required-features = ["dev-tools"]

[[bin]]
name = "capture_depth"
path = "src/bin/capture_depth.rs"
required-features = ["dev-tools"]

[[bin]]
name = "capture_global"
path = "src/bin/capture_global.rs"
required-features = ["dev-tools"]

[[bin]]
name = "capture_option_model"
path = "src/bin/capture_option_model.rs"
required-features = ["dev-tools"]

[[bin]]
name = "capture_dividends"
path = "src/bin/capture_dividends.rs"
required-features = ["dev-tools"]

[[bin]]
name = "capture_status"
path = "src/bin/capture_status.rs"
required-features = ["dev-tools"]

[[bin]]
name = "capture_ticks"
path = "src/bin/capture_ticks.rs"
required-features = ["dev-tools"]

[dependencies]
# Hot loop
core_affinity = "0.8"

# Crypto (RustCrypto ecosystem)
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
aes = "0.8"
cbc = "0.1"

# Protocol
flate2 = "1"
base64 = "0.22"
hex = "0.4"
serde_json = "1"

# Auth (big integer math for DH/SRP)
num-bigint = "0.4"
rand = "0.9"

# TLS
native-tls = "0.2"

# Secure-memory wrappers (zeroize plaintext credentials on drop)
zeroize = "1"

# Logging
log = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
mac_address = "1"

# Python bindings (optional)
pyo3 = { version = "0.29", features = ["multiple-pymethods"], optional = true }
jiff = { version = "0.2.28", features = ["tzdb-bundle-always"] }

[profile.release]
lto = "fat"

# Which card belongs to the address a session opened on. The identity a session
# states is the card of the interface its socket left from, which is not
# necessarily the first card the machine answers with: on some systems that is a
# virtual one. `getifaddrs` is how the address is matched to the interface; the
# card itself still comes from `mac_address`.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["net"] }
