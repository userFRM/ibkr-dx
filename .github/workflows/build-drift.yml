name: build drift

# The build number this client states at logon is a constant here, the latest
# the vendor ships, and the vendor moves it every few weeks. Nothing notices, so
# this does: nightly, it compares the latest published build with the one last
# recorded and fails the run while they differ.
#
# It reports rather than opening a pull request on purpose. What a client states
# at logon decides what the server does with it, and that is a change to make
# deliberately against a paper session, not one to merge unattended overnight.

on:
  schedule:
    # Off-hour, off-minute: the version files are static and there is no
    # reason to ask for them at the top of the hour with everyone else.
    - cron: "37 5 * * *"
  workflow_dispatch:

concurrency:
  group: build-drift
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: announced build vs published build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prove the parsing before trusting the comparison
        run: python3 .github/scripts/check_build_drift.py --self-check

      - name: Compare
        id: compare
        run: |
          set +e
          out=$(python3 .github/scripts/check_build_drift.py 2>&1)
          status=$?
          set -e
          echo "$out"
          {
            echo "report<<EOF"
            echo "$out"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "drifted=$([ $status -eq 0 ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          # Drift is the thing being reported, not a failure of the job. Only a
          # check that could not run at all should fail here.
          [ $status -le 1 ]

      - name: Report
        if: steps.compare.outputs.drifted == 'true'
        env:
          REPORT: ${{ steps.compare.outputs.report }}
        run: |
          # Said here rather than filed as an issue: this repository has issues
          # turned off, and the report died on that every night without ever
          # being read. A red nightly run is the notification.
          {
            echo "## The vendor has published a build this repository has not looked at"
            echo
            echo '```'
            echo "$REPORT"
            echo '```'
            echo
            echo "The constants are \`IB_BUILD\`, \`IB_VERSION\` and \`IB_ENCODED\` in"
            echo "\`src/config.rs\`, and they state the latest build the vendor ships: the"
            echo "venue decides what a session is offered by the build it states. Move them"
            echo "to the new build against a paper session, since what is stated at logon"
            echo "decides what the server does with it."
            echo
            echo "Record the build in \`.github/gateway-build.json\` in the same change."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
