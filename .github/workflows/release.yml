name: release

# A tag `vX.Y.Z` publishes version X.Y.Z: the crate to crates.io, and to PyPI
# every wheel built below and one source distribution. Nothing is published
# until the tag names the version both manifests state and the tagged commit
# passes everything a change has to pass. Run by hand, this builds and checks
# the same things and publishes nothing.
#
# A release runs the workflow as it exists at the tag, so a fix to this file
# has to land before the tag is cut, not after.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# A tag pushed while a run on it is still going waits for that run rather than
# racing it to the registries.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: the tag names the version both manifests state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare the tag, Cargo.toml and pyproject.toml
        shell: python
        run: |
          import os, sys, tomllib

          crate = tomllib.load(open("Cargo.toml", "rb"))["package"]["version"]
          package = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          wrong = []
          if crate != package:
              wrong.append(f"Cargo.toml states {crate} and pyproject.toml states {package}")
          ref = os.environ["GITHUB_REF"]
          if ref.startswith("refs/tags/") and ref.removeprefix("refs/tags/") != f"v{crate}":
              wrong.append(f"the tag is {ref.removeprefix('refs/tags/')}, the manifests state {crate}")
          for line in wrong:
              print(f"::error::{line}")
          sys.exit(1 if wrong else 0)

  # The test workflow itself, run against the tag: the same jobs, the same
  # prerequisites, the same pinned comparison clients, and the same comparison
  # of every generated page and the readme. A copy kept here drifted from it.
  gate:
    name: everything a change has to pass
    needs: version
    uses: ./.github/workflows/tests.yml

  crate:
    name: the crate packages and builds as published
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The file list first, so the log says what a caller downloads; then the
      # packaged crate built on its own, which is what a caller compiles.
      - name: Package
        run: |
          cargo package --list
          cargo publish --dry-run

  # One wheel per platform and per interpreter the bindings build for: each
  # CPython `requires-python` admits, and the free-threaded 3.14t. PyO3 builds
  # for no free-threaded interpreter older than 3.14, so there is no 3.13t. The
  # extension links against the interpreter it was built for, so a version left
  # out is one a caller finds missing at `pip install`.
  wheels:
    name: wheel (${{ matrix.os }}, py${{ matrix.python }})
    needs: gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.14t"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: ${{ matrix.python }}

      - name: Build
        uses: PyO3/maturin-action@v1
        with:
          # Linux builds inside a manylinux container, where the interpreter is
          # named; on macOS and Windows it is the one setup-python installed.
          manylinux: "2_28"
          # The TLS layer links OpenSSL, and the manylinux image carries the
          # library without its headers.
          before-script-linux: dnf install -y openssl-devel
          args: >-
            --release --out dist --interpreter
            ${{ matrix.os == 'ubuntu-latest' && format('python{0}', matrix.python) || steps.python.outputs.python-path }}
          sccache: "true"

      # A wheel that compiles is not a wheel that loads, or one that carries
      # what it should: installed into an interpreter of its own and checked
      # from outside the checkout.
      # A leg asking for the free-threaded interpreter and handed the other one
      # builds a wheel under its neighbour's name, and the upload below keeps
      # one of the two without a word. The check fails that leg instead.
      - name: The wheel installs and carries the published surface
        shell: bash
        env:
          EXPECT_FREE_THREADED: ${{ endsWith(matrix.python, 't') }}
        run: |
          "${{ steps.python.outputs.python-path }}" -m venv "$RUNNER_TEMP/check"
          BIN="$RUNNER_TEMP/check/bin"
          [ -d "$BIN" ] || BIN="$RUNNER_TEMP/check/Scripts"
          "$BIN/python" -m pip install --find-links dist --no-index ibkr-dx
          "$BIN/python" scripts/check_installed_package.py

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*.whl

  sdist:
    name: source distribution
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      # Built from the archive alone, away from the checkout, so a file the
      # archive leaves out fails here rather than on a caller's machine.
      - name: The archive builds and installs on its own
        run: |
          python -m venv "$RUNNER_TEMP/check"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/check/bin/python" -m pip install "$GITHUB_WORKSPACE"/dist/*.tar.gz
          "$RUNNER_TEMP/check/bin/python" "$GITHUB_WORKSPACE/scripts/check_installed_package.py"

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  crates-io:
    name: publish the crate
    needs: [crate, wheels, sdist]
    # A tag pushed, not a run started by hand on one.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # The environment is where the registry tokens and the reviewers who
    # approve a publish are set.
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Pinned by commit: this job holds the registry token.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: cargo publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # After the crate rather than beside it: two registries published in parallel
  # can end with one holding the version and the other not.
  pypi:
    name: publish the wheels and the source distribution
    needs: [crate, wheels, sdist, crates-io]
    # A tag pushed, not a run started by hand on one.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Merged by name, so two legs that built the same file leave one. Three
      # systems by five interpreters is fifteen wheels, and one archive.
      - name: Every wheel and the archive are here
        run: |
          ls dist
          test "$(find dist -name '*.whl' | wc -l)" -eq 15
          test "$(find dist -name '*.tar.gz' | wc -l)" -eq 1
      # Pinned by commit: this job holds the registry token. An upload that
      # failed part-way is finished by running the job again.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
          skip-existing: true

  github-release:
    name: attach the distributions to the release
    needs: [crates-io, pypi]
    # A tag pushed, not a run started by hand on one.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # `gh` learns the repository from a checkout or from GH_REPO, and this
      # job has no checkout.
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
