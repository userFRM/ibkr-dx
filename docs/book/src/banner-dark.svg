<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="100%" height="100%">
  <style>
    /* Dark mode */
    .txt-primary { fill: #FFFFFF; }
    .txt-secondary { fill: #F8FAFC; }
    .txt-tertiary { fill: #94A3B8; }

    .box-outline { stroke: #475569; }

    .icon-stroke {
      stroke: #94A3B8;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-fill {
      fill: #94A3B8;
      stroke: none;
    }

    .grid-line {
      stroke: #FFFFFF;
      stroke-opacity: 0.04;
    }
  </style>

  <defs>
    <!-- Background grid -->
    <pattern id="grid-pattern" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" class="grid-line" stroke-width="1.5" />
    </pattern>

    <!-- Fade the grid toward the edges: in a mask, white shows and black hides -->
    <radialGradient id="fade-gradient" cx="50%" cy="50%" r="75%">
      <stop offset="30%" stop-color="white" />
      <stop offset="85%" stop-color="black" />
    </radialGradient>

    <mask id="fade-mask">
      <rect width="100%" height="100%" fill="url(#fade-gradient)" />
    </mask>

    <!-- Server icon holes, in the icon's own coordinates (it spans 0..46 x 0..44) -->
    <mask id="server-holes" maskUnits="userSpaceOnUse" x="-4" y="-4" width="54" height="52">
      <rect x="-4" y="-4" width="54" height="52" fill="white" />
      <circle cx="8" cy="6" r="2.5" fill="black" />
      <circle cx="8" cy="22" r="2.5" fill="black" />
      <circle cx="8" cy="38" r="2.5" fill="black" />
    </mask>
  </defs>

  <!-- Background grid -->
  <rect width="100%" height="100%" fill="url(#grid-pattern)" mask="url(#fade-mask)" />

  <!-- Main logo -->
  <text x="800" y="195"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="116" font-weight="900" text-anchor="middle" letter-spacing="-2">
    <tspan class="txt-primary">ibkr-</tspan><tspan fill="#DE1A22">dx</tspan>
  </text>

  <!-- Subtitle -->
  <text x="800" y="255"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="32" font-weight="500" class="txt-secondary"
        text-anchor="middle" letter-spacing="0.5">
    Direct connection engine for Interactive Brokers
  </text>

  <!-- Features -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
     font-size="22" font-weight="400" class="txt-tertiary" text-anchor="middle">
    <!-- Rust logo -->
    <svg x="465" y="282" width="30" height="30" viewBox="0 0 224 224">
      <path class="txt-tertiary" d="M218.46 109.358l-9.062-5.614c-.076-.882-.162-1.762-.258-2.642l7.803-7.265a3.107 3.107 0 00.933-2.89 3.093 3.093 0 00-1.967-2.312l-9.97-3.715c-.25-.863-.512-1.72-.781-2.58l6.214-8.628a3.114 3.114 0 00-.592-4.263 3.134 3.134 0 00-1.431-.637l-10.507-1.709a80.869 80.869 0 00-1.263-2.353l4.417-9.7a3.12 3.12 0 00-.243-3.035 3.106 3.106 0 00-2.705-1.385l-10.671.372a85.152 85.152 0 00-1.685-2.044l2.456-10.381a3.125 3.125 0 00-3.762-3.763l-10.384 2.456a88.996 88.996 0 00-2.047-1.684l.373-10.671a3.11 3.11 0 00-1.385-2.704 3.127 3.127 0 00-3.034-.246l-9.681 4.417c-.782-.429-1.567-.854-2.353-1.265l-1.713-10.506a3.098 3.098 0 00-1.887-2.373 3.108 3.108 0 00-3.014.35l-8.628 6.213c-.85-.27-1.703-.53-2.56-.778l-3.716-9.97a3.111 3.111 0 00-2.311-1.97 3.134 3.134 0 00-2.89.933l-7.266 7.802a93.746 93.746 0 00-2.643-.258l-5.614-9.082A3.125 3.125 0 00111.97 4c-1.09 0-2.085.56-2.642 1.478l-5.615 9.081a93.32 93.32 0 00-2.642.259l-7.266-7.802a3.13 3.13 0 00-2.89-.933 3.106 3.106 0 00-2.312 1.97l-3.715 9.97c-.857.247-1.71.506-2.56.778L73.7 12.588a3.101 3.101 0 00-3.014-.35A3.127 3.127 0 0068.8 14.61l-1.713 10.506c-.79.41-1.575.832-2.353 1.265l-9.681-4.417a3.125 3.125 0 00-4.42 2.95l.372 10.67c-.69.553-1.373 1.115-2.048 1.685l-10.383-2.456a3.143 3.143 0 00-2.93.832 3.124 3.124 0 00-.833 2.93l2.436 10.383a93.897 93.897 0 00-1.68 2.043l-10.672-.372a3.138 3.138 0 00-2.704 1.385 3.126 3.126 0 00-.246 3.035l4.418 9.7c-.43.779-.855 1.563-1.266 2.353l-10.507 1.71a3.097 3.097 0 00-2.373 1.886 3.117 3.117 0 00.35 3.013l6.214 8.628a89.12 89.12 0 00-.78 2.58l-9.97 3.715a3.117 3.117 0 00-1.035 5.202l7.803 7.265c-.098.879-.184 1.76-.258 2.642l-9.062 5.614A3.122 3.122 0 004 112.021c0 1.092.56 2.084 1.478 2.642l9.062 5.614c.074.882.16 1.762.258 2.642l-7.803 7.265a3.117 3.117 0 001.034 5.201l9.97 3.716a110 110 0 00.78 2.58l-6.212 8.627a3.112 3.112 0 00.6 4.27c.419.33.916.547 1.443.63l10.507 1.709c.407.792.83 1.576 1.265 2.353l-4.417 9.68a3.126 3.126 0 002.95 4.42l10.65-.3