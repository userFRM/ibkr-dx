    </svg>

    <text x="515" y="305">+</text>

    <!-- Python logo -->
    <svg x="535" y="282" width="30" height="30" viewBox="16 16 32 32">
      <path class="txt-tertiary" d="M31.885 16c-8.124 0-7.617 3.523-7.617 3.523l.01 3.65h7.752v1.095H21.197S16 23.678 16 31.876c0 8.196 4.537 7.906 4.537 7.906h2.708v-3.804s-.146-4.537 4.465-4.537h7.688s4.32.07 4.32-4.175v-7.019S40.374 16 31.885 16zm-4.275 2.454a1.394 1.394 0 1 1 0 2.79 1.393 1.393 0 0 1-1.395-1.395c0-.771.624-1.395 1.395-1.395z"/>
      <path class="txt-tertiary" d="M32.115 47.833c8.124 0 7.617-3.523 7.617-3.523l-.01-3.65H31.97v-1.095h10.832S48 40.155 48 31.958c0-8.197-4.537-7.906-4.537-7.906h-2.708v3.803s.146 4.537-4.465 4.537h-7.688s-4.32-.07-4.32 4.175v7.019s-.656 4.247 7.833 4.247zm4.275-2.454a1.393 1.393 0 0 1-1.395-1.395 1.394 1.394 0 1 1 1.395 1.395z"/>
    </svg>
    <circle cx="615" cy="298" r="4.5" fill="#DE1A22" />

    <text x="695" y="305">JVM-free</text>
    <circle cx="775" cy="298" r="4.5" fill="#DE1A22" />

    <text x="920" y="305">direct to IBKR servers</text>
    <circle cx="1065" cy="298" r="4.5" fill="#DE1A22" />

    <text x="1125" y="305">no GC</text>
  </g>

  <!-- Diagram -->
  <g>
    <!-- Connecting lines -->
    <line x1="540" y1="390" x2="670" y2="390" stroke="#DE1A22" stroke-width="3" />
    <circle cx="615" cy="390" r="8" fill="#DE1A22" />

    <line x1="930" y1="390" x2="1060" y2="390" stroke="#DE1A22" stroke-width="3" />
    <circle cx="995" cy="390" r="8" fill="#DE1A22" />

    <!-- Left box -->
    <rect x="350" y="340" width="190" height="100" rx="10" fill="none" class="box-outline" stroke-width="2.5" />

    <!-- Left box content centered at (445, 390) -->
    <g transform="translate(445 390)">
      <!-- icon, symmetric about x = 0 -->
      <g class="icon-stroke" stroke-width="3" transform="translate(0 -18)">
        <path d="M -14 -9 L -28 0 L -14 9" />
        <line x1="6" y1="-15" x2="-6" y2="15" />
        <path d="M 14 -9 L 28 0 L 14 9" />
      </g>
      <!-- label -->
      <text x="0" y="28"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
            font-size="16" class="txt-secondary" text-anchor="middle">
        Your code
      </text>
    </g>

    <!-- Middle box -->
    <rect x="670" y="340" width="260" height="100" rx="12" fill="none" stroke="#DE1A22" stroke-width="3" />

    <!-- Middle box content centered at (800, 390) -->
    <text x="800" y="402"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="42" font-weight="900" text-anchor="middle" letter-spacing="-1">
      <tspan class="txt-primary">ibkr-</tspan><tspan fill="#DE1A22">dx</tspan>
    </text>

    <!-- Right box -->
    <rect x="1060" y="340" width="190" height="100" rx="10" fill="none" class="box-outline" stroke-width="2.5" />

    <!-- Right box content centered at (1155, 390) -->
    <g transform="translate(1155 390)">
      <!-- icon -->
      <g class="icon-fill" mask="url(#server-holes)" transform="translate(-23 -31)">
        <rect x="0" y="0" width="46" height="12" rx="2.5" />
        <rect x="0" y="16" width="46" height="12" rx="2.5" />
        <rect x="0" y="32" width="46" height="12" rx="2.5" />
      </g>
      <!-- label -->
      <text x="0" y="28"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
            font-size="16" class="txt-secondary" text-anchor="middle">
        IBKR servers
      </text>
    </g>
  </g>

  <!-- Footer -->
  <text x="800" y="500"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="20" font-weight="400" class="txt-tertiary"
        text-anchor="middle">
    A simpler path without a JVM process in the middle.
  </text>
</svg>
