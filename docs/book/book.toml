[book]
title = "IBKR-DX"
description = "Talk directly to IBKR: the TWS API with no gateway in between. Rust and Python."
authors = ["IBKR-DX contributors"]
language = "en"
src = "src"

[output.html]
default-theme = "light"
preferred-dark-theme = "coal"
git-repository-url = "https://github.com/userFRM/ibkr-dx"
edit-url-template = "https://github.com/userFRM/ibkr-dx/edit/main/docs/book/{path}"
no-section-label = true
additional-css = ["theme/custom.css"]

[output.html.fold]
enable = true
level = 1

[output.html.playground]
runnable = false
